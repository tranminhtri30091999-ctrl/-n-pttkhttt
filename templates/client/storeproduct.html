<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Milky Leaf - Sản phẩm</title>
  <link rel="stylesheet" href="/static/css/client.css" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/client/index.html">🧋 Milky Leaf</a>
    <nav class="site-nav">
      <a href="/client/index.html">Trang chủ</a><a href="/client/storeproduct.html">Sản phẩm</a>
      <a href="/client/checkout.html">Giỏ hàng <span class="cart-count">0</span></a><a href="/client/orders.html">Đơn hàng</a>
    </nav>
    <div class="auth-actions"><a class="btn btn-secondary" href="/client/login.html">Đăng nhập</a></div>
  </header>
  <main>
    <section class="section">
      <div class="section-head"><div><h1>Sản phẩm</h1><p class="muted">Tìm kiếm, lọc giá và chọn sản phẩm để xem chi tiết.</p></div></div>
      <form class="filter-bar" data-product-filter>
        <input type="search" name="q" placeholder="Tìm theo tên sản phẩm" aria-label="Tìm sản phẩm" />
        <input type="number" name="min_price" placeholder="Giá từ" min="0" />
        <input type="number" name="max_price" placeholder="Giá đến" min="0" />
        <button class="btn btn-primary" type="submit">Lọc</button>
      </form>
      <p class="status-message" data-product-message role="status"></p>
      <div class="product-grid" data-product-list><p class="muted">Đang tải sản phẩm…</p></div>
    </section>
  </main>
  <footer class="site-footer"><p>© 2026 Milky Leaf. All rights reserved.</p></footer>
  <script src="/static/js/client.js"></script>
</body>
</html>
