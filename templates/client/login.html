<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Milky Leaf - Đăng nhập / đăng ký</title><link rel="stylesheet" href="/static/css/client.css"/><link rel="stylesheet" href="/static/css/shop-enhancements.css"/></head>
<body><header class="site-header"><a class="brand" href="/client/index.html">🧋 Milky Leaf</a><nav class="site-nav"><a href="/client/index.html">Trang chủ</a><a href="/client/storeproduct.html">Sản phẩm</a><a href="/client/checkout.html">Giỏ hàng</a></nav></header>
<main><section class="section checkout"><h1>Tài khoản khách hàng</h1><p class="muted">Đăng nhập để đặt hàng hoặc tạo tài khoản mới miễn phí.</p>
<div class="auth-tabs"><button class="btn btn-primary" type="button" data-auth-tab="login">Đăng nhập</button><button class="btn btn-secondary" type="button" data-auth-tab="register">Đăng ký</button></div>
<form class="checkout-form" data-auth-form="login"><label>Vai trò<select name="role" required><option value="customer">Khách hàng</option><option value="staff">Nhân viên</option><option value="admin">Quản trị viên</option></select></label><label>Tên đăng nhập<input name="username" autocomplete="username" required maxlength="30"/></label><label>Mật khẩu<input type="password" name="password" autocomplete="current-password" required/></label><p class="status-message" data-auth-message role="status"></p><button class="btn btn-primary" type="submit">Đăng nhập</button></form>
<form class="checkout-form" data-auth-form="register" hidden><label>Vai trò<select name="role" required><option value="customer">Khách hàng</option><option value="staff">Nhân viên</option></select></label><label>Tên đăng nhập<input name="username" autocomplete="username" required minlength="3" maxlength="30" pattern="[A-Za-z0-9_.-]+"/></label><label>Mật khẩu (ít nhất 8 ký tự)<input type="password" name="password" autocomplete="new-password" required minlength="8" maxlength="128"/></label><p class="status-message" data-register-message role="status"></p><button class="btn btn-primary" type="submit">Tạo tài khoản</button></form>
</section></main><div class="toast-region" aria-live="polite"></div>
<script>
const forms={login:document.querySelector('[data-auth-form="login"]'),register:document.querySelector('[data-auth-form="register"]')};
document.querySelectorAll('[data-auth-tab]').forEach(button=>button.addEventListener('click',()=>{Object.entries(forms).forEach(([key,form])=>form.hidden=key!==button.dataset.authTab);document.querySelectorAll('[data-auth-tab]').forEach(tab=>tab.className=tab===button?'btn btn-primary':'btn btn-secondary')}));
function toast(message,type='success'){const node=document.createElement('div');node.className=`toast toast-${type}`;node.textContent=message;const region=document.querySelector('.toast-region');region.append(node);requestAnimationFrame(()=>node.classList.add('toast-visible'));setTimeout(()=>node.remove(),3200)}
async function submitAuth(form,url,message){const button=form.querySelector('button[type="submit"]');button.disabled=true;message.textContent='Đang xử lý…';try{const payload=Object.fromEntries(new FormData(form));const response=await fetch(url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const data=await response.json();if(!response.ok||!data.ok)throw new Error(data.error||'Không thể xác thực tài khoản.');if(payload.role&&data.user.role!==payload.role)throw new Error('Tài khoản không thuộc vai trò đã chọn.');toast(url.includes('register')?'Đăng ký thành công!':'Đăng nhập thành công!');const destination=data.user.role==='admin'?'/admin/users.html':data.user.role==='staff'?'/staff/orders.html':'/client/index.html';setTimeout(()=>location.href=destination,500)}catch(error){message.className='status-message error-message';message.textContent=error.message;toast(error.message,'error')}finally{button.disabled=false}}
forms.login.addEventListener('submit',event=>{event.preventDefault();submitAuth(forms.login,'/admin/login',document.querySelector('[data-auth-message]'));});
forms.register.addEventListener('submit',event=>{event.preventDefault();submitAuth(forms.register,'/api/client/register',document.querySelector('[data-register-message]'));});
</script></body></html>
