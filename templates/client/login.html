<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Milky Leaf - Đăng nhập / đăng ký</title><link rel="stylesheet" href="/static/css/client.css"></head><body>
<header class="site-header"><a class="brand" href="/client/index.html">🧋 Milky Leaf</a><nav class="site-nav"><a href="/client/index.html">Trang chủ</a><a href="/client/storeproduct.html">Sản phẩm</a><a href="/client/checkout.html">Giỏ hàng <span class="cart-count">0</span></a></nav></header><main><section class="section checkout"><h1>Tài khoản khách hàng</h1><p class="muted">Đăng nhập để đặt hàng hoặc tạo tài khoản mới miễn phí.</p><div class="auth-tabs"><button class="btn btn-primary" type="button" data-auth-tab="login">Đăng nhập</button><button class="btn btn-secondary" type="button" data-auth-tab="register">Đăng ký</button></div>
<form class="checkout-form" data-auth-form="login"><label>Tên đăng nhập hoặc số điện thoại<input name="identifier" autocomplete="username" required maxlength="30"></label><label>Mật khẩu<input type="password" name="password" autocomplete="current-password" required maxlength="128"></label><p class="status-message" data-auth-message role="status"></p><button class="btn btn-primary" type="submit">Đăng nhập</button></form>
<form class="checkout-form" data-auth-form="register" hidden><label>Họ và tên<input name="full_name" autocomplete="name" required minlength="2" maxlength="120" pattern="[^\W\d_][\wÀ-ỹ'’.-]*(\s+[^\W\d_][\wÀ-ỹ'’.-])+" title="Nhập họ tên gồm ít nhất hai từ"></label><label>Số điện thoại<input type="tel" name="phone" autocomplete="tel" required inputmode="numeric" pattern="0[0-9]{9}" maxlength="10" title="10 chữ số, bắt đầu bằng số 0"></label><label>Tên đăng nhập<input name="username" autocomplete="username" required minlength="3" maxlength="30" pattern="[A-Za-z0-9_.-]+"></label><label>Mật khẩu<input type="password" name="password" autocomplete="new-password" required minlength="8" maxlength="128" pattern="(?=.*[^A-Za-z0-9]).{8,128}" title="Ít nhất 8 ký tự và có một ký hiệu đặc biệt"></label><p class="status-message" data-register-message role="status"></p><button class="btn btn-primary" type="submit">Đăng ký</button></form>
</section></main><footer class="site-footer"><p>© 2026 Milky Leaf. All rights reserved.</p></footer><div class="toast-region" aria-live="polite"></div><script src="/static/js/client.js"></script></body></html>
