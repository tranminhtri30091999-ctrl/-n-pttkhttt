<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Milky Leaf - Quản lý đơn hàng</title><link rel="stylesheet" href="/static/css/client.css"/></head><body>
<header class="site-header"><a class="brand" href="/staff/index.html">🧋 Milky Leaf - Staff</a><nav class="site-nav"><a href="/staff/orders.html">Đơn hàng</a><a href="/staff/products.html">Sản phẩm</a><a href="/staff/bills.html">Hóa đơn</a><a href="/staff/dashboard.html">Thống kê</a></nav><div class="auth-actions"><span class="role-badge">Nhân viên</span><button class="btn btn-secondary" id="logout" type="button">Đăng xuất</button></div></header>
<main><section class="section"><h1>Duyệt / hủy đơn hàng</h1><p class="muted">Đơn chờ duyệt chưa trừ kho. Duyệt đơn sẽ trừ kho; hủy đơn đã duyệt sẽ hoàn lại kho.</p><p class="status-message" data-message role="status">Đang tải…</p><div class="table-wrap"><table class="admin-table"><thead><tr><th>Mã</th><th>Khách hàng</th><th>Sản phẩm / tồn kho</th><th>Tổng</th><th>Trạng thái</th><th>Ngày tạo</th><th>Thao tác</th></tr></thead><tbody data-orders></tbody></table></div></section></main>
<script>
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>new Intl.NumberFormat('vi-VN').format(Number(n)||0)+'đ';
async function load(){const body=document.querySelector('[data-orders]'),msg=document.querySelector('[data-message]');try{const r=await fetch('/staff/api/orders',{credentials:'same-origin'}),d=await r.json();if(r.status===401||r.status===403){msg.innerHTML='Cần đăng nhập với tài khoản nhân viên/admin. <a href="/client/login.html">Đăng nhập</a>';body.replaceChildren();return}if(!r.ok||!d.ok)throw Error(d.error||'Không tải được đơn hàng');msg.textContent=d.orders.length?'':'Chưa có đơn hàng.';body.innerHTML=d.orders.map(o=>{const items=o.items.map(i=>`${escapeHtml(i.name||'Sản phẩm')} × ${Number(i.quantity)} · Tồn: ${i.stock==null?'—':Number(i.stock)}`).join('<br>');const actions=o.status==='pending'?`<button class="btn btn-primary" data-action="approve" data-id="${Number(o.id)}">Duyệt</button> <button class="btn btn-secondary" data-action="cancel" data-id="${Number(o.id)}">Hủy</button>`:o.status==='approved'?`<button class="btn btn-secondary" data-action="cancel" data-id="${Number(o.id)}">Hủy / hoàn kho</button>`:'—';return `<tr><td>#${Number(o.id)}</td><td>${escapeHtml(o.customer_name)}<br>${escapeHtml(o.phone)} · ${escapeHtml(o.username)}<br>${escapeHtml(o.delivery_address)}</td><td>${items}</td><td>${money(o.total)}</td><td>${escapeHtml(o.status)}</td><td>${escapeHtml(o.created_at)}</td><td>${actions}</td></tr>`}).join('')}catch(e){msg.className='status-message error-message';msg.textContent=e.message}}
document.querySelector('[data-orders]').addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b)return;const id=Number(b.dataset.id),action=b.dataset.action;if(action==='cancel'&&!confirm(`Hủy đơn #${id}? Kho chỉ hoàn lại khi đơn đã được duyệt trước đó.`))return;b.disabled=true;try{const r=await fetch(`/staff/api/orders/${id}/${action}`,{method:'POST',credentials:'same-origin'}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Không cập nhật được đơn');await load();const msg=document.querySelector('[data-message]');msg.className='status-message success-message';msg.textContent=action==='approve'?`Đơn #${id} đã duyệt — số lượng tồn đã được trừ.`:`Đơn #${id} đã hủy — số lượng tồn đã được hoàn lại nếu đơn trước đó đã duyệt.`}catch(e){alert(e.message);b.disabled=false}});document.getElementById('logout').addEventListener('click',async()=>{await fetch('/admin/logout',{method:'POST'});location.href='/client/login.html'});load();
</script></body></html>
