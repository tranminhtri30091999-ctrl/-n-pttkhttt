<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Milky Leaf - Nhân viên sản phẩm</title>
  <link rel="stylesheet" href="../../static/css/client.css" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/staff/index.html">🧋 Milky Leaf - Staff</a>
    <nav class="site-nav">
      <a href="/staff/orders.html">Đơn hàng</a>
      <a href="/staff/products.html">Sản phẩm</a>
      <a href="/staff/bills.html">Hóa đơn</a>
      <a href="/staff/dashboard.html">Thống kê</a>
    </nav>
    <div class="auth-actions">
      <span class="role-badge">Staff</span>
      <button class="btn btn-secondary" type="button" onclick="logout()">Đăng xuất</button>
    </div>
  </header>
  <main>
    <section class="section">
      <h1>Quản lý sản phẩm</h1>
      <form class="checkout-form" id="product-form">
        <input type="hidden" name="id" />
        <label>Tên sản phẩm <input name="name" required /></label>
        <label>Giá <input name="price" type="number" min="0" step="1000" required /></label>
        <label>Số lượng tồn <input name="stock" type="number" min="0" required /></label>
        <label>Danh mục <input name="category" required /></label>
        <label>URL hình ảnh <input name="image_url" /></label>
        <label>Mô tả <textarea name="description"></textarea></label>
        <div class="form-actions"><button class="btn btn-primary" type="submit" id="submit-btn">Thêm sản phẩm</button><button class="btn btn-secondary" type="button" id="cancel-btn" hidden>Hủy sửa</button></div>
      </form>
      <p class="status-message" data-message></p>
      <div class="table-wrap"><table class="admin-table"><thead><tr><th>ID</th><th>Tên</th><th>Giá</th><th>Tồn</th><th>Danh mục</th><th>Thao tác</th></tr></thead><tbody data-products></tbody></table></div>
    </section>
  </main>
  <script>
    const form=document.getElementById('product-form'),body=document.querySelector('[data-products]'),msg=document.querySelector('[data-message]');
    const money=n=>new Intl.NumberFormat('vi-VN').format(Number(n)||0)+'đ';
    async function load(){const r=await fetch('/staff/api/products',{credentials:'same-origin'}),d=await r.json();if(!d.ok){msg.textContent=d.error||'Không tải được';return}body.innerHTML=d.products.map(p=>`<tr><td>${p.id}</td><td>${p.name}</td><td>${money(p.price)}</td><td>${p.stock}</td><td>${p.category}</td><td><button class="btn btn-small" data-edit="${p.id}" data-name="${encodeURIComponent(p.name)}" data-price="${p.price}" data-stock="${p.stock}" data-category="${encodeURIComponent(p.category)}" data-description="${encodeURIComponent(p.description)}" data-image="${encodeURIComponent(p.image_url)}">Sửa</button> <button class="btn btn-small" data-delete="${p.id}">Xóa</button></td></tr>`).join('')}
    function reset(){form.reset();form.id.value='';document.getElementById('submit-btn').textContent='Thêm sản phẩm';document.getElementById('cancel-btn').hidden=true}
    form.addEventListener('submit',async e=>{e.preventDefault();const id=form.id.value,payload={name:form.name.value,price:form.price.value,stock:form.stock.value,category:form.category.value,image_url:form.image_url.value,description:form.description.value};const r=await fetch(id?'/staff/api/products/'+id:'/staff/api/products',{method:id?'PUT':'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(payload)}),d=await r.json();if(!d.ok)return alert(d.error||'Lưu thất bại');reset();load()});
    body.addEventListener('click',async e=>{const edit=e.target.closest('[data-edit]'),del=e.target.closest('[data-delete]');if(edit){form.id.value=edit.dataset.edit;form.name.value=decodeURIComponent(edit.dataset.name);form.price.value=edit.dataset.price;form.stock.value=edit.dataset.stock;form.category.value=decodeURIComponent(edit.dataset.category);form.description.value=decodeURIComponent(edit.dataset.description);form.image_url.value=decodeURIComponent(edit.dataset.image);document.getElementById('submit-btn').textContent='Cập nhật sản phẩm';document.getElementById('cancel-btn').hidden=false}if(del&&confirm('Xóa sản phẩm này?')){const r=await fetch('/staff/api/products/'+del.dataset.delete,{method:'DELETE',credentials:'same-origin'}),d=await r.json();if(!d.ok)alert(d.error||'Xóa thất bại');else load()}});
    document.getElementById('cancel-btn').addEventListener('click',reset);
    async function logout() {
      await fetch('/admin/logout', { method: 'POST', credentials: 'same-origin' });
      window.location.href = '/client/login.html';
    }
  </script>
</body>
</html>
