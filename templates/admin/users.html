<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Milky Leaf - Admin</title>
  <link rel="stylesheet" href="../../static/css/client.css" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="../client/index.html">🧋 Milky Leaf</a>
    <nav class="site-nav">
      <a href="../client/index.html">Trang chủ</a>
      <a href="users.html">Người dùng</a>
      <a href="../staff/dashboard.html">Báo cáo</a>
    </nav>
    <div class="auth-actions">
      <span class="role-badge">Admin</span>
      <button class="btn btn-secondary" type="button" onclick="logout()">Đăng xuất</button>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="section-head">
        <h1>Quản lý người dùng</h1>
        <p>Thêm, sửa, xóa tài khoản và thay đổi vai trò.</p>
      </div>

      <form class="checkout-form" id="user-form">
        <input type="hidden" name="id" />
        <label>
          Tên đăng nhập
          <input type="text" name="username" required />
        </label>
        <label>
          Mật khẩu
          <input type="password" name="password" placeholder="Để trống khi sửa nếu không đổi" />
        </label>
        <label>
          Vai trò
          <select name="role" required>
            <option value="customer">Customer</option>
            <option value="staff">Staff</option>
            <option value="admin">Admin</option>
          </select>
        </label>
        <div class="form-actions">
          <button class="btn btn-primary" type="submit" id="submit-btn">Thêm người dùng</button>
          <button class="btn btn-secondary" type="button" id="cancel-btn" hidden>Hủy sửa</button>
        </div>
      </form>

      <div class="table-wrap" style="margin-top: 2rem;">
        <table class="admin-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Tên đăng nhập</th>
              <th>Vai trò</th>
              <th>Thao tác</th>
            </tr>
          </thead>
          <tbody id="users-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const form = document.getElementById('user-form');
    const usersBody = document.getElementById('users-body');
    const submitBtn = document.getElementById('submit-btn');
    const cancelBtn = document.getElementById('cancel-btn');

    async function loadUsers() {
      const res = await fetch('/admin/api/users', { credentials: 'same-origin' });
      const data = await res.json();
      if (!data.ok) return;
      usersBody.innerHTML = data.users.map(user => `
        <tr>
          <td>${user.id}</td>
          <td>${user.username}</td>
          <td><span class="role-badge">${user.role}</span></td>
          <td>
            <button class="btn btn-small" onclick="editUser(${user.id}, '${user.username}', '${user.role}')">Sửa</button>
            <button class="btn btn-small" onclick="deleteUser(${user.id})">Xóa</button>
          </td>
        </tr>
      `).join('');
    }

    function editUser(id, username, role) {
      form.id.value = id;
      form.username.value = username;
      form.password.value = '';
      form.role.value = role;
      submitBtn.textContent = 'Cập nhật người dùng';
      cancelBtn.hidden = false;
    }

    function resetForm() {
      form.reset();
      form.id.value = '';
      submitBtn.textContent = 'Thêm người dùng';
      cancelBtn.hidden = true;
    }

    async function deleteUser(id) {
      if (!confirm('Xóa người dùng này?')) return;
      const res = await fetch('/admin/api/users/' + id, {
        method: 'DELETE',
        credentials: 'same-origin'
      });
      const data = await res.json();
      if (!data.ok) {
        alert(data.error || 'Xóa thất bại');
        return;
      }
      loadUsers();
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const id = form.id.value;
      const payload = {
        username: form.username.value,
        password: form.password.value,
        role: form.role.value
      };
      const url = id ? '/admin/api/users/' + id : '/admin/api/users';
      const method = id ? 'PUT' : 'POST';
      const res = await fetch(url, {
        method,
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (!data.ok) {
        alert(data.error || 'Lưu thất bại');
        return;
      }
      resetForm();
      loadUsers();
    });

    cancelBtn.addEventListener('click', resetForm);

    async function logout() {
      await fetch('/admin/logout', { method: 'POST', credentials: 'same-origin' });
      window.location.href = '../client/login.html';
    }

    loadUsers();
  </script>
</body>
</html>
