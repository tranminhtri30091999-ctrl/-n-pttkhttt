<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Milky Leaf - Quản lý tài khoản</title>
  <link rel="stylesheet" href="/static/css/admin.css" />
</head>
<body class="admin">
  <!-- Cột điều hướng cố định (sidebar luôn hiển thị) -->
  {% include 'staff/_sidebar.html' %}

  <!-- Nội dung tương ứng với mục đang chọn -->
  <main class="admin-main">
    <header class="page-head">
      <div>
        <h1>Quản lý tài khoản</h1>
        <p>Thêm, sửa, xóa tài khoản và thay đổi vai trò.</p>
      </div>
    </header>

    <section class="panel">
      <h2 id="form-title">Thêm người dùng</h2>
      <form class="user-form" id="user-form">
        <input type="hidden" name="id" />
        <label>
          Tên đăng nhập
          <input type="text" name="username" required />
        </label>
        <label>
          Mật khẩu
          <input type="password" name="password" placeholder="Để trống khi sửa nếu không đổi" />
        </label>
        <label>
          Vai trò
          <select name="role" required>
            <option value="customer">Customer</option>
            <option value="staff">Staff</option>
            <option value="admin">Admin</option>
          </select>
        </label>
        <div class="form-actions">
          <button class="btn btn-approve" type="submit" id="submit-btn">Thêm người dùng</button>
          <button class="btn btn-cancel" type="button" id="cancel-btn" hidden>Hủy sửa</button>
        </div>
      </form>
    </section>

    <section class="panel panel-gap">
      <h2>Danh sách tài khoản</h2>
      <div class="table-scroll">
        <table class="data">
          <thead>
            <tr>
              <th>ID</th>
              <th>Tên đăng nhập</th>
              <th>Vai trò</th>
              <th>Thao tác</th>
            </tr>
          </thead>
          <tbody id="users-body">
            <tr>
              <td class="empty-row" colspan="4">Đang tải dữ liệu...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const form = document.getElementById('user-form');
    const usersBody = document.getElementById('users-body');
    const submitBtn = document.getElementById('submit-btn');
    const cancelBtn = document.getElementById('cancel-btn');
    const formTitle = document.getElementById('form-title');

    async function api(url, options) {
      const res = await fetch(url, Object.assign(
        { credentials: 'same-origin' }, options || {}
      ));
      if (res.status === 401 || res.status === 403) {
        window.location.href = '/client/login.html';
        throw new Error('unauthorized');
      }
      return res.json();
    }

    async function loadWho() {
      try {
        const data = await api('/admin/me');
        if (data.ok) {
          document.getElementById('who-name').textContent = data.user.username;
        }
      } catch (error) { /* redirect handled in api() */ }
    }

    const escapeHtml = (value) =>
      String(value).replace(/[&<>"']/g, (ch) =>
        '&#' + ch.charCodeAt(0) + ';');

    let usersCache = [];

    async function loadUsers() {
      try {
        const data = await api('/admin/api/users');
        if (!data.ok) throw new Error(data.error || 'Không tải được danh sách');
        usersCache = data.users;
        if (!data.users.length) {
          usersBody.innerHTML =
            '<tr><td class="empty-row" colspan="4">Chưa có tài khoản nào.</td></tr>';
          return;
        }
        usersBody.innerHTML = data.users.map(user => `
          <tr>
            <td class="order-id">${user.id}</td>
            <td>${escapeHtml(user.username)}</td>
            <td><span class="badge badge-${escapeHtml(user.role)}">${escapeHtml(user.role)}</span></td>
            <td>
              <div class="row-actions">
                <button class="btn btn-print" onclick="editUser(${user.id})">Sửa</button>
                <button class="btn btn-cancel" onclick="deleteUser(${user.id})">Xóa</button>
              </div>
            </td>
          </tr>
        `).join('');
      } catch (error) {
        if (error.message !== 'unauthorized') {
          usersBody.innerHTML =
            `<tr><td class="empty-row" colspan="4">${escapeHtml(error.message)}</td></tr>`;
        }
      }
    }

    function editUser(id) {
      const user = usersCache.find(item => item.id === id);
      if (!user) return;
      form.id.value = user.id;
      form.username.value = user.username;
      form.password.value = '';
      form.role.value = user.role;
      submitBtn.textContent = 'Cập nhật người dùng';
      formTitle.textContent = 'Sửa người dùng';
      cancelBtn.hidden = false;
      form.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function resetForm() {
      form.reset();
      form.id.value = '';
      submitBtn.textContent = 'Thêm người dùng';
      formTitle.textContent = 'Thêm người dùng';
      cancelBtn.hidden = true;
    }

    async function deleteUser(id) {
      if (!confirm('Xóa người dùng này?')) return;
      try {
        const data = await api('/admin/api/users/' + id, { method: 'DELETE' });
        if (!data.ok) {
          alert(data.error || 'Xóa thất bại');
          return;
        }
        loadUsers();
      } catch (error) { /* redirect handled in api() */ }
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const id = form.id.value;
      const payload = {
        username: form.username.value,
        password: form.password.value,
        role: form.role.value
      };
      const url = id ? '/admin/api/users/' + id : '/admin/api/users';
      const method = id ? 'PUT' : 'POST';
      try {
        const data = await api(url, {
          method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (!data.ok) {
          alert(data.error || 'Lưu thất bại');
          return;
        }
        resetForm();
        loadUsers();
      } catch (error) { /* redirect handled in api() */ }
    });

    cancelBtn.addEventListener('click', resetForm);

    async function logout() {
      await fetch('/admin/logout', { method: 'POST', credentials: 'same-origin' });
      window.location.href = '/client/login.html';
    }

    loadWho();
    loadUsers();
  </script>
</body>
</html>
