<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="920" viewBox="0 0 1420 920">
  <defs>
    <style>
      .title { font: 800 20px "Segoe UI", Arial, sans-serif; fill: #2b1f1a; }
      .sub { font: 500 13px "Segoe UI", Arial, sans-serif; fill: #6b5a53; }
      .entity-rect { fill: #ffffff; stroke: #2b1f1a; stroke-width: 2; }
      .entity-txt { font: 700 14px "Segoe UI", Arial, sans-serif; fill: #2b1f1a; text-anchor: middle; }
      .proc-box { fill: #ffffff; stroke: #7a4b2a; stroke-width: 2; }
      .proc-head { fill: #7a4b2a; }
      .proc-focus { fill: #fff6ec; stroke: #d98b45; stroke-width: 3; }
      .proc-focus-head { fill: #d98b45; }
      .proc-num { font: 800 13px "Segoe UI", Arial, sans-serif; fill: #ffffff; text-anchor: middle; }
      .proc-txt { font: 700 13px "Segoe UI", Arial, sans-serif; fill: #2b1f1a; text-anchor: middle; }
      .store-bg { fill: #ffffff; }
      .store-focus { fill: #fff6ec; }
      .store-line { stroke: #7a4b2a; stroke-width: 2; fill: none; }
      .store-focus-line { stroke: #d98b45; stroke-width: 2.5; fill: none; }
      .store-id { font: 800 13px "Segoe UI", Arial, sans-serif; fill: #7a4b2a; text-anchor: middle; }
      .store-txt { font: 700 13px "Segoe UI", Arial, sans-serif; fill: #2b1f1a; }
      .flow { fill: none; stroke: #5a4a42; stroke-width: 1.7; }
      .flow-focus { fill: none; stroke: #c96a1b; stroke-width: 2.2; }
      .lbl-bg { fill: #fffaf5; stroke: #efe4da; stroke-width: 0.8; rx: 4; }
      .lbl { font: 600 11.5px "Segoe UI", Arial, sans-serif; fill: #3b2d26; }
      .lbl-focus { font: 700 11.5px "Segoe UI", Arial, sans-serif; fill: #9c4708; }
      .legend-txt { font: 600 12px "Segoe UI", Arial, sans-serif; fill: #4a3b34; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a4a42"/>
    </marker>
    <marker id="arr-focus" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c96a1b"/>
    </marker>
  </defs>

  <rect width="1420" height="920" fill="#fffaf5"/>
  <text x="710" y="36" text-anchor="middle" class="title">SƠ ĐỒ LUỒNG DỮ LIỆU MỨC ĐỈNH (DFD LEVEL 0) — HỆ THỐNG BÁN HÀNG MILKY LEAF</text>
  <text x="710" y="58" text-anchor="middle" class="sub">Phân tích luồng dữ liệu toàn hệ thống — Phạm vi Quản lý Sản phẩm &amp; Kho (2.0 và D2)</text>

  <!-- LAYER 1: FLOWS -->
  <g id="flows">
    <!-- Admin <-> 1.0 -->
    <path d="M 275 116 L 478 116" class="flow" marker-end="url(#arr)"/>
    <path d="M 478 148 L 277 148" class="flow" marker-end="url(#arr)"/>

    <!-- Staff <-> 2.0 (Focus) -->
    <path d="M 185 352 L 185 246 L 478 246" class="flow-focus" marker-end="url(#arr-focus)"/>
    <path d="M 478 286 L 222 286 L 222 350" class="flow-focus" marker-end="url(#arr-focus)"/>

    <!-- Staff <-> 4.0 -->
    <path d="M 275 390 L 348 390 L 348 548 L 478 548" class="flow" marker-end="url(#arr)"/>
    <path d="M 478 584 L 316 584 L 316 408 L 277 408" class="flow" marker-end="url(#arr)"/>

    <!-- Staff <-> 5.0 (via clean left gutter outside Khách hàng) -->
    <path d="M 105 406 L 56 406 L 56 716 L 478 716" class="flow" marker-end="url(#arr)"/>
    <path d="M 478 756 L 28 756 L 28 380 L 103 380" class="flow" marker-end="url(#arr)"/>

    <!-- Customer <-> 3.0 -->
    <path d="M 275 636 L 404 636 L 404 402 L 478 402" class="flow" marker-end="url(#arr)"/>
    <path d="M 478 438 L 376 438 L 376 668 L 277 668" class="flow" marker-end="url(#arr)"/>

    <!-- 1.0 <-> D1 -->
    <path d="M 730 114 L 1068 114" class="flow" marker-end="url(#arr)"/>
    <path d="M 1068 144 L 732 144" class="flow" marker-end="url(#arr)"/>

    <!-- 2.0 <-> D2 (Focus) -->
    <path d="M 730 246 L 1068 246" class="flow-focus" marker-end="url(#arr-focus)"/>
    <path d="M 1068 278 L 732 278" class="flow-focus" marker-end="url(#arr-focus)"/>

    <!-- D2 -> 3.0 (Focus) -->
    <path d="M 1070 296 L 945 296 L 945 398 L 732 398" class="flow-focus" marker-end="url(#arr-focus)"/>

    <!-- 4.0 <-> D2 (Focus) -->
    <path d="M 730 546 L 800 546 L 800 318 L 1068 318" class="flow-focus" marker-end="url(#arr-focus)" marker-start="url(#arr-focus)"/>

    <!-- D2 -> 5.0 (Focus, via right outer channel) -->
    <path d="M 1365 296 L 1390 296 L 1390 796 L 732 796" class="flow-focus" marker-end="url(#arr-focus)"/>

    <!-- 3.0 -> D3 & D4 -->
    <path d="M 730 434 L 1068 434" class="flow" marker-end="url(#arr)"/>
    <path d="M 730 456 L 845 456 L 845 574 L 1068 574" class="flow" marker-end="url(#arr)"/>

    <!-- 4.0 <-> D3 & D4 -->
    <path d="M 730 572 L 885 572 L 885 468 L 1068 468" class="flow" marker-end="url(#arr)" marker-start="url(#arr)"/>
    <path d="M 1068 604 L 732 604" class="flow" marker-end="url(#arr)"/>

    <!-- D3, D4 -> 5.0 & 5.0 <-> D5 -->
    <path d="M 1070 482 L 980 482 L 980 704 L 732 704" class="flow" marker-end="url(#arr)"/>
    <path d="M 1070 618 L 1015 618 L 1015 732 L 732 732" class="flow" marker-end="url(#arr)"/>
    <path d="M 730 760 L 1068 760" class="flow" marker-end="url(#arr)" marker-start="url(#arr)"/>
  </g>

  <!-- LAYER 2: NODES -->
  <!-- External Entities -->
  <g>
    <rect x="105" y="100" width="170" height="64" rx="4" class="entity-rect"/>
    <rect x="111" y="106" width="158" height="52" rx="2" fill="none" stroke="#c8b6a8" stroke-width="1"/>
    <text x="190" y="137" class="entity-txt">Admin</text>
  </g>
  <g>
    <rect x="105" y="352" width="170" height="72" rx="4" class="entity-rect" stroke="#c96a1b" stroke-width="2.5"/>
    <rect x="111" y="358" width="158" height="60" rx="2" fill="none" stroke="#e9c4a6" stroke-width="1"/>
    <text x="190" y="385" class="entity-txt">Nhân viên</text>
    <text x="190" y="405" class="entity-txt">bán hàng</text>
  </g>
  <g>
    <rect x="105" y="618" width="170" height="64" rx="4" class="entity-rect"/>
    <rect x="111" y="624" width="158" height="52" rx="2" fill="none" stroke="#c8b6a8" stroke-width="1"/>
    <text x="190" y="655" class="entity-txt">Khách hàng</text>
  </g>

  <!-- Processes -->
  <g>
    <rect x="480" y="88" width="250" height="86" rx="14" class="proc-box"/>
    <path d="M480 102 Q480 88 494 88 L716 88 Q730 88 730 102 L730 116 L480 116 Z" class="proc-head"/>
    <text x="605" y="107" class="proc-num">1.0</text>
    <text x="605" y="140" class="proc-txt">Quản lý tài khoản</text>
    <text x="605" y="159" class="proc-txt">&amp; Phân quyền</text>
  </g>
  <g>
    <rect x="480" y="220" width="250" height="92" rx="14" class="proc-focus"/>
    <path d="M480 234 Q480 220 494 220 L716 220 Q730 220 730 234 L730 248 L480 248 Z" class="proc-focus-head"/>
    <text x="605" y="239" class="proc-num">2.0</text>
    <text x="605" y="274" class="proc-txt">Quản lý sản phẩm</text>
    <text x="605" y="294" class="proc-txt">&amp; Tồn kho</text>
  </g>
  <g>
    <rect x="480" y="378" width="250" height="90" rx="14" class="proc-box"/>
    <path d="M480 392 Q480 378 494 378 L716 378 Q730 378 730 392 L730 406 L480 406 Z" class="proc-head"/>
    <text x="605" y="397" class="proc-num">3.0</text>
    <text x="605" y="432" class="proc-txt">Tiếp nhận</text>
    <text x="605" y="451" class="proc-txt">&amp; Đặt hàng</text>
  </g>
  <g>
    <rect x="480" y="522" width="250" height="92" rx="14" class="proc-box"/>
    <path d="M480 536 Q480 522 494 522 L716 522 Q730 522 730 536 L730 550 L480 550 Z" class="proc-head"/>
    <text x="605" y="541" class="proc-num">4.0</text>
    <text x="605" y="576" class="proc-txt">Xử lý đơn hàng</text>
    <text x="605" y="595" class="proc-txt">&amp; Điều chỉnh kho</text>
  </g>
  <g>
    <rect x="480" y="684" width="250" height="122" rx="14" class="proc-box"/>
    <path d="M480 698 Q480 684 494 684 L716 684 Q730 684 730 698 L730 712 L480 712 Z" class="proc-head"/>
    <text x="605" y="703" class="proc-num">5.0</text>
    <text x="605" y="748" class="proc-txt">Lập hóa đơn</text>
    <text x="605" y="768" class="proc-txt">&amp; Báo cáo thống kê</text>
  </g>

  <!-- Data Stores -->
  <g>
    <rect x="1070" y="102" width="295" height="54" class="store-bg"/>
    <path d="M1365 102 L1070 102 L1070 156 L1365 156" class="store-line"/>
    <line x1="1115" y1="102" x2="1115" y2="156" class="store-line"/>
    <text x="1092" y="134" class="store-id">D1</text>
    <text x="1130" y="134" class="store-txt">Người dùng (users)</text>
  </g>
  <g>
    <rect x="1070" y="232" width="295" height="90" class="store-focus"/>
    <path d="M1365 232 L1070 232 L1070 322 L1365 322" class="store-focus-line"/>
    <line x1="1115" y1="232" x2="1115" y2="322" class="store-focus-line"/>
    <text x="1092" y="281" class="store-id" style="fill:#c96a1b">D2</text>
    <text x="1130" y="281" class="store-txt">Sản phẩm &amp; Kho (products)</text>
  </g>
  <g>
    <rect x="1070" y="424" width="295" height="66" class="store-bg"/>
    <path d="M1365 424 L1070 424 L1070 490 L1365 490" class="store-line"/>
    <line x1="1115" y1="424" x2="1115" y2="490" class="store-line"/>
    <text x="1092" y="462" class="store-id">D3</text>
    <text x="1130" y="462" class="store-txt">Đơn hàng (orders)</text>
  </g>
  <g>
    <rect x="1070" y="562" width="295" height="64" class="store-bg"/>
    <path d="M1365 562 L1070 562 L1070 626 L1365 626" class="store-line"/>
    <line x1="1115" y1="562" x2="1115" y2="626" class="store-line"/>
    <text x="1092" y="599" class="store-id">D4</text>
    <text x="1130" y="599" class="store-txt">Chi tiết đơn (order_items)</text>
  </g>
  <g>
    <rect x="1070" y="732" width="295" height="54" class="store-bg"/>
    <path d="M1365 732 L1070 732 L1070 786 L1365 786" class="store-line"/>
    <line x1="1115" y1="732" x2="1115" y2="786" class="store-line"/>
    <text x="1092" y="764" class="store-id">D5</text>
    <text x="1130" y="764" class="store-txt">Hóa đơn (invoices)</text>
  </g>

  <!-- LAYER 3: CLEAN NON-OVERLAPPING LABELS -->
  <g id="labels">
    <!-- Admin <-> 1.0 -->
    <rect x="300" y="95" width="154" height="18" class="lbl-bg"/>
    <text x="377" y="108" text-anchor="middle" class="lbl">Thêm/sửa/xóa user, quyền</text>
    <rect x="315" y="151" width="124" height="18" class="lbl-bg"/>
    <text x="377" y="164" text-anchor="middle" class="lbl">DS tài khoản, kết quả</text>

    <!-- Staff <-> 2.0 -->
    <rect x="218" y="224" width="228" height="18" class="lbl-bg"/>
    <text x="332" y="237" text-anchor="middle" class="lbl-focus">Thêm/sửa/xóa SP (tên, giá, ảnh, SL)</text>
    <rect x="255" y="290" width="176" height="18" class="lbl-bg"/>
    <text x="343" y="303" text-anchor="middle" class="lbl-focus">DS sản phẩm, cảnh báo tồn</text>

    <!-- Staff <-> 4.0 -->
    <rect x="275" y="482" width="142" height="18" class="lbl-bg"/>
    <text x="346" y="495" text-anchor="middle" class="lbl">Yêu cầu duyệt / hủy đơn</text>
    <rect x="270" y="588" width="152" height="18" class="lbl-bg"/>
    <text x="346" y="601" text-anchor="middle" class="lbl">DS đơn hàng &amp; trạng thái</text>

    <!-- Staff <-> 5.0 -->
    <rect x="118" y="707" width="204" height="18" class="lbl-bg"/>
    <text x="220" y="720" text-anchor="middle" class="lbl">Yêu cầu xuất hóa đơn / thống kê</text>
    <rect x="135" y="761" width="170" height="18" class="lbl-bg"/>
    <text x="220" y="774" text-anchor="middle" class="lbl">Hóa đơn in &amp; báo cáo DT</text>

    <!-- Customer <-> 3.0 -->
    <rect x="288" y="614" width="176" height="18" class="lbl-bg"/>
    <text x="376" y="627" text-anchor="middle" class="lbl">Tìm kiếm, lọc giá, đặt hàng</text>
    <rect x="292" y="672" width="166" height="18" class="lbl-bg"/>
    <text x="375" y="685" text-anchor="middle" class="lbl">Danh mục SP, tồn, xác nhận</text>

    <!-- 1.0 <-> D1 -->
    <rect x="815" y="93" width="168" height="18" class="lbl-bg"/>
    <text x="899" y="106" text-anchor="middle" class="lbl">Ghi thông tin tài khoản</text>
    <rect x="822" y="148" width="154" height="18" class="lbl-bg"/>
    <text x="899" y="161" text-anchor="middle" class="lbl">Đọc hồ sơ &amp; vai trò</text>

    <!-- 2.0 <-> D2 -->
    <rect x="786" y="224" width="224" height="18" class="lbl-bg"/>
    <text x="898" y="237" text-anchor="middle" class="lbl-focus">Lưu mới / cập nhật / xóa sản phẩm</text>
    <rect x="806" y="257" width="184" height="18" class="lbl-bg"/>
    <text x="898" y="270" text-anchor="middle" class="lbl-focus">Đọc thông tin &amp; số lượng tồn</text>

    <!-- D2 -> 3.0 -->
    <rect x="802" y="376" width="168" height="18" class="lbl-bg"/>
    <text x="886" y="389" text-anchor="middle" class="lbl-focus">DS sản phẩm, giá, tồn kho</text>

    <!-- 4.0 <-> D2 -->
    <rect x="838" y="310" width="204" height="34" class="lbl-bg"/>
    <text x="940" y="324" text-anchor="middle" class="lbl-focus">Kiểm tra, trừ tồn (duyệt đơn)</text>
    <text x="940" y="339" text-anchor="middle" class="lbl-focus">/ Hoàn trả tồn (hủy đơn)</text>

    <!-- D2 -> 5.0 -->
    <rect x="940" y="787" width="208" height="18" class="lbl-bg"/>
    <text x="1044" y="800" text-anchor="middle" class="lbl-focus">Tên SP (hóa đơn) &amp; tồn kho hiện tại</text>

    <!-- 3.0 -> D3 & D4 -->
    <rect x="860" y="414" width="152" height="18" class="lbl-bg"/>
    <text x="936" y="427" text-anchor="middle" class="lbl">Tạo đơn mới (pending)</text>
    <rect x="875" y="553" width="156" height="18" class="lbl-bg"/>
    <text x="953" y="566" text-anchor="middle" class="lbl">Lưu dòng SP &amp; SL đặt</text>

    <!-- 4.0 <-> D3 & D4 -->
    <rect x="896" y="458" width="162" height="18" class="lbl-bg"/>
    <text x="977" y="471" text-anchor="middle" class="lbl">Đọc / cập nhật trạng thái đơn</text>
    <rect x="815" y="608" width="164" height="18" class="lbl-bg"/>
    <text x="897" y="621" text-anchor="middle" class="lbl">Đọc chi tiết SP trong đơn</text>

    <!-- D3, D4 -> 5.0 & 5.0 <-> D5 -->
    <rect x="782" y="683" width="154" height="18" class="lbl-bg"/>
    <text x="859" y="696" text-anchor="middle" class="lbl">DS đơn theo thời gian</text>
    <rect x="785" y="722" width="148" height="18" class="lbl-bg"/>
    <text x="859" y="735" text-anchor="middle" class="lbl">Chi tiết dòng hóa đơn</text>
    <rect x="822" y="751" width="154" height="18" class="lbl-bg"/>
    <text x="899" y="764" text-anchor="middle" class="lbl">Lưu / truy xuất hóa đơn</text>
  </g>

  <!-- Legend -->
  <g transform="translate(56, 835)">
    <rect x="0" y="0" width="1308" height="58" rx="10" fill="#ffffff" stroke="#eadfd6" stroke-width="1.5"/>
    <rect x="24" y="16" width="38" height="26" class="entity-rect"/>
    <text x="74" y="34" class="legend-txt">Tác nhân ngoài (External Entity)</text>

    <rect x="315" y="16" width="44" height="26" rx="6" class="proc-box"/>
    <text x="372" y="34" class="legend-txt">Tiến trình mức đỉnh (Process)</text>

    <path d="M 625 17 L 590 17 L 590 41 L 625 41" class="store-line"/>
    <text x="636" y="34" class="legend-txt">Kho dữ liệu (Data Store)</text>

    <line x1="845" y1="29" x2="893" y2="29" class="flow-focus" marker-end="url(#arr-focus)"/>
    <text x="905" y="34" class="legend-txt" style="fill:#9c4708">Luồng dữ liệu liên quan đến Kho &amp; Sản phẩm</text>
  </g>
</svg>